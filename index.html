<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Calculator</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="btn operator" data-value="C">C</button>
            <button class="btn operator" data-value="&#177;">&#177;</button>
            <button class="btn operator" data-value="%">%</button>
            <button class="btn operator" data-value="/">&#247;</button>

            <button class="btn" data-value="7">7</button>
            <button class="btn" data-value="8">8</button>
            <button class="btn" data-value="9">9</button>
            <button class="btn operator" data-value="*">&#215;</button>

            <button class="btn" data-value="4">4</button>
            <button class="btn" data-value="5">5</button>
            <button class="btn" data-value="6">6</button>
            <button class="btn operator" data-value="-">-</button>

            <button class="btn" data-value="1">1</button>
            <button class="btn" data-value="2">2</button>
            <button class="btn" data-value="3">3</button>
            <button class="btn operator" data-value="+">+</button>

            <button class="btn zero" data-value="0">0</button>
            <button class="btn" data-value=".">.</button>
            <button class="btn equals" data-value="=">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        let expression = '';

        const buttons = document.querySelectorAll('.btn');

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const value = button.dataset.value;

                if (value === 'C') {
                    expression = '';
                    display.textContent = '0';
                } else if (value === '=') {
                    if (expression) {
                        try {
                            const result = evaluate(expression);
                            display.textContent = expression + ' = ' + result;
                            expression = String(result);
                        } catch (e) {
                            display.textContent = 'Error';
                            expression = '';
                        }
                    }
                } else if (['+', '-', '*', '/'].includes(value)) {
                    // Replace last operator if user presses two operators in a row
                    if (/[+\-*/]$/.test(expression)) {
                        expression = expression.slice(0, -1);
                    }
                    expression += value;
                    display.textContent = expression;
                } else if (value === '%') {
                    const match = expression.match(/[\d.]+$/);
                    if (match) {
                        const num = parseFloat(match[0]);
                        expression = expression.slice(0, match.index) + (num / 100);
                        display.textContent = expression;
                    }
                } else if (value === '&#177;') {
                    const match = expression.match(/[\d.]+$/);
                    if (match) {
                        const num = parseFloat(match[0]);
                        const neg = num * -1;
                        expression = expression.slice(0, match.index) + neg;
                        display.textContent = expression;
                    }
                } else {
                    // Numbers and decimal
                    if (value === '.' && /\.\d*$/.test(expression)) return;
                    expression += value;
                    display.textContent = expression;
                }
            });
        });

        function evaluate(expr) {
            // Replace display symbols with real operators
            expr = expr.replace(/\u00F7/g, '/').replace(/\u00D7/g, '*');
            // Use Function to safely evaluate the expression
            const tokens = expr.match(/\d+\.?\d*|[+\-*/]/g);
            if (!tokens) return 0;

            // Handle multiplication and division first
            let i = 0;
            while (i < tokens.length) {
                if (tokens[i] === '*' || tokens[i] === '/') {
                    const a = parseFloat(tokens[i - 1]);
                    const b = parseFloat(tokens[i + 1]);
                    let result;
                    if (tokens[i] === '*') result = a * b;
                    else result = b !== 0 ? a / b : 'Error';
                    if (result === 'Error') return 'Error';
                    tokens.splice(i - 1, 3, String(result));
                    i--;
                }
                i++;
            }

            // Handle addition and subtraction
            let result = parseFloat(tokens[0]);
            for (let j = 1; j < tokens.length; j += 2) {
                const op = tokens[j];
                const num = parseFloat(tokens[j + 1]);
                if (op === '+') result += num;
                else if (op === '-') result -= num;
            }
            return result;
        }
    </script>
</body>
</html>
